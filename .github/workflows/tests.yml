name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore multi-tenant-stores-backend.slnx

      - name: Build solution
        run: dotnet build multi-tenant-stores-backend.slnx --no-restore

      - name: Run tests
        run: dotnet test multi-tenant-stores-backend.slnx --no-build --logger "trx;LogFileName=test-results.trx"
